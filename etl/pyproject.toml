[project]
name = "puckwise-etl"
version = "0.1.0"
description = "ETL pipeline for Puckwise hockey analytics"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
